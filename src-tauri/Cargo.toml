[package]
name = "pet-app"
description = "Cross-platform desktop pet application"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "pet-app"

[lib]
name = "pet_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Used by `tauri build` so the frontend is embedded instead of loaded from the
# dev server. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pet-core = { path = "../crates/pet-core" }
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "image-ico",
  "macos-private-api",
  "protocol-asset",
] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
axum = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
