[package]
name = "bytepet-app"
description = "BytePet: cross-platform desktop pet with Codex-compatible atlases and LLM chat"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "bytepet-app"

[lib]
name = "bytepet_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Used by `tauri build` so the frontend is embedded instead of loaded from the
# dev server. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytepet-core = { path = "../crates/bytepet-core" }
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "image-ico",
  "macos-private-api",
  "protocol-asset",
] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
axum = { workspace = true }
image = { workspace = true }
