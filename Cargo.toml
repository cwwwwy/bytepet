[workspace]
resolver = "2"
members = ["crates/pet-core", "crates/pet-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["book"]

[workspace.dependencies]
# --- shared basics ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }

# --- async / http ---
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "process",
  "fs",
  "io-util",
  "net",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "rustls-native-certs",
  "charset",
  "http2",
] }
axum = { version = "0.8", features = ["ws", "json", "tokio"] }

# --- assets / storage ---
image = { version = "0.25", default-features = false, features = [
  "webp",
  "png",
  "jpeg",
] }
# FTS5 is compiled in by the bundled SQLite build.
rusqlite = { version = "0.37", features = ["bundled"] }
# Real platform credential stores: macOS Keychain / Windows Credential Manager.
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
] }
toml_edit = "0.25"
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
