[workspace]
resolver = "2"
members = ["crates/bytepet-core", "crates/bytepet-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["book"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
winit = "0.30"
tray-icon = "0.24"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
