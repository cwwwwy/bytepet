<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
      }
      body.dragging {
        cursor: grabbing;
      }
      #pet-canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto;
        -webkit-user-drag: none;
      }
      #bubble {
        position: fixed;
        left: 50%;
        bottom: 100%;
        transform: translate(-50%, -6px);
        max-width: 220px;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(24, 24, 27, 0.92);
        color: #f4f4f5;
        font: 12px/1.45 system-ui, -apple-system, "PingFang SC", sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #bubble.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <div id="bubble"></div>
    <script type="module" src="/src/pet/main.ts"></script>
  </body>
</html>
